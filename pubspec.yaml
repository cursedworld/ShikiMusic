name: shiki
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.1

dependencies:
  crypto: ^3.0.7
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  http: ^1.6.0
  audioplayers: ^6.6.0
  path_provider: ^2.1.5
  flutter_discord_rpc:
    path: third_party/flutter_discord_rpc
  file_picker: ^10.3.10
  audio_service: ^0.18.12
  permission_handler: ^11.4.0
  flutter_media_session: ^2.3.0
  image: ^4.3.0
  wakelock_plus: ^1.5.2
  video_player: ^2.8.6
  video_player_win: ^2.1.2
  video_player_media_kit: ^2.0.0
  media_kit_libs_linux: ^1.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  msix: ^3.16.13

flutter:
  uses-material-design: true

flutter_icons:
  android: true
  ios: true
  windows:
    generate: true
    image_path: "assets/icon.png"
  image_path: "assets/icon.png"
